<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>dither test</title>
<style>
html,body{margin:0;background:#090c10;color:#e7edf3;font:12px monospace}
.stage{position:relative;width:630px;height:460px;margin:20px;border:1px solid rgba(255,255,255,.08);background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:16px 16px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.row{display:flex;flex-wrap:wrap}
</style></head><body>
<div class="row" id="row"></div>
<script type="module">
import { createFigure } from './js/figure.js';
const q = new URLSearchParams(location.search);
const fig = createFigure({ reduced: true });
window.fig = fig;
const specs = JSON.parse(q.get('s') || '[{"resolve":0}]');
const W = +(q.get('w') || 630), H = +(q.get('h') || 460);
const hosts = specs.map(s => { const d = document.createElement('div'); d.className = 'stage'; d.style.width = W + 'px'; d.style.height = H + 'px'; document.getElementById('row').append(d); return fig.addHost(d, s); });
await fig.setModel(q.get('m') || 'robo-catcher');
if (q.get('tone')) { const t = q.get('tone').split(',').map(Number); fig.tone(...t); }
await new Promise(r => setTimeout(r, 300));
fig.refreshAll();
window.ready = true;
</script></body></html>
