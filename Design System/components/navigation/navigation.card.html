<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:28px var(--space-6);background:var(--paper);font-family:var(--font-body)}.row{display:flex;align-items:center;gap:var(--space-5);flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:var(--space-6)}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-300)}</style></head><body style="padding:0"><div id="root"></div>
<script type="text/babel">
const { SiteHeader, NavLink, SlideCounter, ScrollCue, SocialRail } = window.MertTReliDesignSystem_56763c;
const items=[{id:'work',label:'Work'},{id:'about',label:'About'},{id:'contact',label:'Contact'}];
function Demo(){
  const [i,setI]=React.useState(1);
  return(<div>
    <div style={{'--header-h':'72px','--page-margin':'28px'}}><SiteHeader items={items} active="work"/></div>
    <div style={{position:'relative',background:'var(--ink-900)','--header-h':'72px','--page-margin':'28px'}}>
      <SiteHeader items={items} active="about" inverse floating/>
      <div style={{height:72}}></div>
    </div>
    <div style={{padding:'28px',display:'flex',flexDirection:'column',gap:'var(--space-6)'}}>
      <div className="row" style={{gap:'var(--space-8)'}}>
        <NavLink active>Active</NavLink><NavLink>Default</NavLink>
        <SlideCounter current={i} total={3} onPrev={()=>setI(v=>v>1?v-1:3)} onNext={()=>setI(v=>v<3?v+1:1)}/>
        <SlideCounter variant="steps" current={2} total={3}/>
        <SlideCounter variant="dots" current={1} total={4}/>
      </div>
      <div className="row" style={{gap:'var(--space-7)'}}>
        <ScrollCue/><ScrollCue shape="bare" label="Scroll"/>
        <SocialRail style={{flexDirection:'row'}} items={[{name:'Instagram',icon:'instagram'},{name:'LinkedIn',icon:'linkedin'},{name:'Mail',icon:'mail'}]}/>
      </div>
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
