<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--ink-900);display:grid;place-items:center;position:relative;overflow:hidden}
.main span{position:absolute;inset:0;background-image:var(--grain-url);background-size:220px;mix-blend-mode:overlay;opacity:.3}
.mark{position:relative;font-family:var(--font-display);font-weight:500;font-size:96px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);line-height:1;white-space:nowrap;text-indent:.14em}
.strip{width:320px;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style></head><body>
<div class="wrap">
<div class="main"><div class="mark">Mert Türeli</div><span></span></div>
<div class="strip"><i style="background:#DEDEDE"></i><i style="background:#A8A8A8"></i><i style="background:#6B6B6B"></i><i style="background:#2B2B2B"></i></div>
</div></body></html>
