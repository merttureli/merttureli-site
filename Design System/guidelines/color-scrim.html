<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="row">
<div style="flex:1;position:relative;height:130px;background:linear-gradient(120deg,var(--ink-600),var(--ink-300))"><span style="position:absolute;inset:0;background:var(--scrim-hero)"></span><span class="k" style="position:absolute;left:12px;top:10px;color:var(--paper)">scrim-hero</span></div>
<div style="flex:1;position:relative;height:130px;background:linear-gradient(120deg,var(--ink-600),var(--ink-300))"><span style="position:absolute;inset:0;background:var(--scrim-bottom-up)"></span><span class="k" style="position:absolute;left:12px;bottom:10px;color:var(--paper)">scrim-bottom-up</span></div>
<div style="flex:1;position:relative;height:130px;background:linear-gradient(120deg,var(--ink-600),var(--ink-300))"><span style="position:absolute;inset:0;background:rgba(10,10,10,.28)"></span><span class="k" style="position:absolute;left:12px;top:10px;color:var(--paper)">flat 28%</span></div></div></body></html>
