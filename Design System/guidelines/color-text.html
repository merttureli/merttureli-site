<!-- @dsCard group="Colors" viewport="700x180" name="Text tones" subtitle="Display, body, muted, meta — and their inverse pair" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="row" style="gap:0"><div class="col" style="flex:1;gap:10px;padding:18px 20px;background:var(--paper)">
<div style="font-family:var(--font-display);font-size:20px;color:var(--text-display)">Display ink</div>
<div style="color:var(--text-body)">Body copy sits at 700.</div>
<div style="color:var(--text-muted);font-size:14px">Muted secondary line</div>
<div class="k" style="color:var(--text-meta)">Meta / 400</div></div>
<div class="col on-dark" style="flex:1;gap:10px;padding:18px 20px;background:var(--ink-900)">
<div style="font-family:var(--font-display);font-size:20px;color:var(--text-display)">Display paper</div>
<div style="color:var(--text-body)">Body copy at 90% paper.</div>
<div style="color:var(--text-muted);font-size:14px">Muted secondary line</div>
<div class="k" style="color:var(--text-meta)">Meta / 45%</div></div></div></body></html>
