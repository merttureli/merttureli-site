<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="col" style="gap:14px;max-width:var(--measure)">
<p style="font-size:var(--fs-body-lg);line-height:var(--lh-body);color:var(--text-body)">Body large, 18px. Used for the lead paragraph of a project or an about page.</p>
<p style="font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-body)">Body, 16px. The default. Set ragged right, never justified, never wider than 62 characters.</p>
<p style="font-size:var(--fs-body-sm);line-height:var(--lh-body);color:var(--text-muted)">Body small, 14px. Secondary notes and footers.</p></div></body></html>
