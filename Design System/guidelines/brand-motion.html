<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}@keyframes sl{from{left:0}to{left:calc(100% - 32px)}}</style></head><body><div class="col" style="gap:16px">
<div class="k">ease-out · cubic-bezier(0.22, 1, 0.36, 1)</div>
<div style="position:relative;height:52px;background:var(--ink-050);overflow:hidden"><span style="position:absolute;top:10px;left:0;width:32px;height:32px;background:var(--ink-900);border-radius:var(--radius-pill);animation:sl 2600ms var(--ease-out) infinite alternate"></span></div>
<div class="row" style="gap:22px"><div class="col" style="gap:4px"><div class="kk" style="color:var(--ink-900)">dur-1</div><div class="kk">120ms</div></div><div class="col" style="gap:4px"><div class="kk" style="color:var(--ink-900)">dur-2</div><div class="kk">240ms</div></div><div class="col" style="gap:4px"><div class="kk" style="color:var(--ink-900)">dur-3</div><div class="kk">480ms</div></div><div class="col" style="gap:4px"><div class="kk" style="color:var(--ink-900)">dur-4</div><div class="kk">780ms</div></div><div class="col" style="gap:4px"><div class="kk" style="color:var(--ink-900)">dur-5</div><div class="kk">1200ms</div></div><div class="col" style="gap:4px"><div class="kk" style="color:var(--ink-900)">dur-6</div><div class="kk">2400ms</div></div></div></div></body></html>
