<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="row" style="gap:var(--space-8)">
<div class="col" style="flex:1;gap:6px"><div style="font-family:var(--font-display);font-size:38px;letter-spacing:-.03em;text-transform:uppercase;color:var(--ink-900)">Space Grotesk</div><div style="font-family:var(--font-display);font-size:14px;color:var(--ink-500)">300 · 400 · 500 · 600 · 700 — display, titles, body, nav</div><div class="kk">--font-display / --font-body</div></div>
<div class="col" style="flex:1;gap:6px"><div style="font-family:var(--font-mono);font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-900)">IBM Plex Mono</div><div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--ink-500)">300 · 400 · 500 — meta, specs, indices, captions</div><div class="kk">--font-mono</div></div></div></body></html>
