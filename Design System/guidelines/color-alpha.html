<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="row" style="gap:0">
<div class="row" style="flex:1;gap:0;background:linear-gradient(120deg,var(--ink-050),var(--ink-200))"><div style="flex:1;height:100px;background:var(--ink-a80);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-050)">a80</span></div><div style="flex:1;height:100px;background:var(--ink-a55);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-050)">a55</span></div><div style="flex:1;height:100px;background:var(--ink-a30);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-050)">a30</span></div><div style="flex:1;height:100px;background:var(--ink-a12);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-050)">a12</span></div><div style="flex:1;height:100px;background:var(--ink-a06);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-050)">a06</span></div></div>
<div class="row" style="flex:1;gap:0;background:linear-gradient(120deg,var(--ink-800),var(--ink-500))"><div style="flex:1;height:100px;background:var(--paper-a90);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-700)">a90</span></div><div style="flex:1;height:100px;background:var(--paper-a70);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-700)">a70</span></div><div style="flex:1;height:100px;background:var(--paper-a45);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-700)">a45</span></div><div style="flex:1;height:100px;background:var(--paper-a18);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-700)">a18</span></div><div style="flex:1;height:100px;background:var(--paper-a08);display:grid;place-items:end;padding:6px"><span class="kk" style="color:var(--ink-700)">a08</span></div></div></div></body></html>
