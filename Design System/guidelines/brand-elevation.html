<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="row" style="gap:var(--space-7);padding:14px 6px 22px"><div class="col" style="flex:1;gap:10px;align-items:center"><div style="width:100%;height:96px;background:var(--paper);border:1px solid var(--ink-a12);border-radius:var(--radius-lg);box-shadow:var(--shadow-none)"></div><div class="kk">shadow-none</div></div><div class="col" style="flex:1;gap:10px;align-items:center"><div style="width:100%;height:96px;background:var(--paper);border:1px solid var(--ink-a12);border-radius:var(--radius-lg);box-shadow:var(--shadow-panel)"></div><div class="kk">shadow-panel</div></div><div class="col" style="flex:1;gap:10px;align-items:center"><div style="width:100%;height:96px;background:var(--paper);border:1px solid var(--ink-a12);border-radius:var(--radius-lg);box-shadow:var(--shadow-float)"></div><div class="kk">shadow-float</div></div></div></body></html>
