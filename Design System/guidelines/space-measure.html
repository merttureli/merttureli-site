<!-- @dsCard group="Spacing" viewport="700x180" name="Measure" subtitle="62ch default, 44ch narrow — never full-bleed text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper);font-family:var(--font-body);color:var(--text-body)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-400);white-space:nowrap}.kk{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-300)}.row{display:flex;gap:var(--space-4)}.col{display:flex;flex-direction:column}</style></head><body><div class="col" style="gap:12px">
<p style="max-width:var(--measure);font-size:15px;line-height:var(--lh-body);border-right:1px dashed var(--ink-200);padding-right:8px">62ch. Copy stops here regardless of how wide the viewport gets. The whitespace to the right of a paragraph is a deliberate part of the layout, not a gap waiting to be filled.</p>
<p style="max-width:var(--measure-narrow);font-size:15px;line-height:var(--lh-body);color:var(--text-muted);border-right:1px dashed var(--ink-200);padding-right:8px">44ch. The narrow measure, for sidebars and captions.</p></div></body></html>
