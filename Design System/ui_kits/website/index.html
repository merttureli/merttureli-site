<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mert Türeli</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
body{background:var(--paper)}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
footer a{border:none}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./Plate.jsx"></script>
<script type="text/babel" src="./HomeScreen.jsx"></script>
<script type="text/babel" src="./WorkScreen.jsx"></script>
<script type="text/babel" src="./ProjectScreen.jsx"></script>
<script type="text/babel" src="./AboutScreen.jsx"></script>
<script type="text/babel">
window.DS = window.MertTReliDesignSystem_56763c;
const { Wordmark, Rule, Meta, NavLink } = window.DS;

function Footer({ onNavigate }) {
  return (
    <footer style={{ padding: "var(--space-8) var(--page-margin) var(--space-7)", borderTop: "1px solid var(--line-hairline)", display: "flex", flexDirection: "column", gap: "var(--space-7)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: "var(--space-8)", flexWrap: "wrap" }}>
        <Wordmark size="lg" />
        <div style={{ display: "flex", gap: "var(--space-7)" }}>
          {window.SITE.nav.map(n => <NavLink key={n.id} onClick={(e)=>{e.preventDefault();onNavigate(n.id);}}>{n.label}</NavLink>)}
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", gap: "var(--space-6)" }}>
        <Meta>© 2026 Mert Türeli</Meta>
        <Meta>London / 51°30′ N</Meta>
      </div>
    </footer>
  );
}

function App() {
  const [page, setPage] = React.useState("index");
  const [item, setItem] = React.useState(null);
  const go = (p) => { setPage(p); window.scrollTo({ top: 0 }); };
  const open = (w) => { setItem(w); setPage("project"); window.scrollTo({ top: 0 }); };
  const screens = {
    index: <window.HomeScreen onNavigate={go} onOpen={open} />,
    work: <window.WorkScreen onNavigate={go} onOpen={open} />,
    project: <window.ProjectScreen onNavigate={go} onOpen={open} item={item} />,
    about: <window.AboutScreen onNavigate={go} />,
    contact: <window.AboutScreen onNavigate={go} contact />,
  };
  return (
    <div key={page + (item ? item.id : "")} style={{ animation: "fade var(--dur-3) var(--ease-out) both" }}>
      {screens[page]}
      <Footer onNavigate={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
