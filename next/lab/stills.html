<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product stills lab</title>
<meta name="robots" content="noindex">
<!-- Renders one product still from next/js/case-stage.js (the hero showreel's actor, same look) on a
     transparent canvas of any size, for posters: ?key=therma-shift&w=1600&h=900&stage-capture=1
     (&t=SECONDS poses that moment of the case-page sequence; default the start pose). A script reads
     window.__caseStage once .ready is true: python3 tools/stills.py. -->
<style>
  html, body { margin: 0; background: #e7e8ea; }
  .stage__card { position: relative; overflow: hidden; }
  .stage__live, .stage__live canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="stage__card" id="card"><div class="stage__live" id="live"><canvas aria-hidden="true"></canvas></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const card = document.getElementById('card');
  card.style.width = (+q.get('w') || 1600) + 'px';
  card.style.height = (+q.get('h') || 900) + 'px';
  document.getElementById('live').dataset.caseStage = q.get('key') || 'therma-shift';
</script>
<script type="module" src="../js/case-stage.js"></script>
</body>
</html>
