<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudder pedals lab</title>
<meta name="robots" content="noindex">
<!-- Generated by `python3 tools/new.py actor rudder-pedals`. Plays js/showreel/rudder-pedals.js the way
     the hero does (same engine, camera, timeline and call order as showreel/index.js) and
     checks the project actor interface. Hash options: #t=6.5 (seek and pause), #fast (3x),
     #q=low (low quality), #shot (hide the panel), #noword (no drift word to avoid). -->
<style>
  :root { --paper: #e7e8ea; --ink: #121315; --line: rgba(18, 19, 21, .14); --ok: #2f7a4f; --bad: #b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .frame { position: fixed; border: 1px dashed rgba(18, 19, 21, .28); pointer-events: none; }
  .avoid { position: fixed; background: rgba(179, 38, 30, .07); border: 1px dashed rgba(179, 38, 30, .4); pointer-events: none; }
  .word { position: fixed; font: 500 clamp(22px, 2.5vw, 40px)/1 system-ui, sans-serif; letter-spacing: -.02em; white-space: nowrap; pointer-events: none; }
  .word.s-xl { font-size: clamp(30px, 3.9vw, 66px); font-weight: 760; text-transform: uppercase; }
  .word.s-m { font-size: clamp(20px, 2vw, 32px); font-style: italic; }
  .word.s-s { font-size: 11px; text-transform: uppercase; }
  .ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: grid; gap: 8px; max-width: 560px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .62); backdrop-filter: blur(8px); }
  .row { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px; }
  .row input { width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: rgba(255, 255, 255, .6); border-radius: 999px; padding: 5px 10px; cursor: pointer; color: inherit; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; max-height: 30vh; overflow: auto; }
  .checks li::before { content: "ok   "; color: var(--ok); white-space: pre; }
  .checks li.bad::before { content: "FAIL "; color: var(--bad); }
  .stat { opacity: .65; }
  summary { cursor: pointer; }
  summary.bad { color: var(--bad); }
  body.shot .ui, body.shot .frame, body.shot .avoid { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="frame" id="frame" aria-hidden="true"></div>
<div class="avoid" id="avoid" aria-hidden="true"></div>
<i class="word s-l" id="word" style="left: 59%; top: 38%" aria-hidden="true">Rudder pedals</i>
<div class="ui">
  <div class="row"><input id="t" type="range" min="0" max="1" step="0.01" value="0" aria-label="Reel time"><span id="tv">0.00 s</span></div>
  <div class="btns">
    <button id="play" aria-pressed="false">play</button>
    <button id="fast" aria-pressed="false">3x</button>
    <button id="abort">abort</button>
    <button id="reset">reset</button>
    <button id="wordbtn" aria-pressed="true">word</button>
  </div>
  <div class="stat" id="state">loading</div>
  <details id="checksbox"><summary id="checksum">checks</summary><ul class="checks" id="checks"></ul></details>
  <div class="stat" id="stat"></div>
</div>
<script type="module">
import { createEngine, createTimeline, clamp01 } from '../js/showreel/engine.js';
import * as mod from '../js/showreel/rudder-pedals.js';

const hash = new URLSearchParams(location.hash.slice(1));
const errors = [];
addEventListener('error', e => errors.push(String(e.message || e)));
addEventListener('unhandledrejection', e => errors.push(String(e.reason && e.reason.message || e.reason)));
if (hash.has('shot')) document.body.classList.add('shot');
const $ = id => document.getElementById(id);
const EXIT = 'ROCKET_EXIT', RETURN = 'ROCKET_RETURN';

// The hero's camera (hero3d.js LAYOUTS), with the values it had when this lab was generated as a fallback.
let LAYOUTS = { land: { fov: 24, dist: 2.2 }, port: { fov: 24, dist: 3.0 } };
let applyCamera = (camera, L) => { camera.fov = L.fov; camera.position.set(0, 0, L.dist); camera.updateProjectionMatrix(); };
try { const h = await import('../js/hero3d.js'); if (h.LAYOUTS) LAYOUTS = h.LAYOUTS; if (h.applyCamera) applyCamera = h.applyCamera; } catch (e) { console.info('[lab] hero3d.js not available, using fallback camera'); }

const canvas = $('c');
const engine = createEngine({ canvas, preserve: true });
const quality = hash.get('q') || 'high';
const actor = await mod.createActor({ engine, quality });
engine.scene.add(actor.group);
const timeline = createTimeline([[EXIT, 2.1], ...actor.sequence, [RETURN, 2.6]]);
const S = timeline.states;

// Same frame the hero hands the actor (index.js frameInfo), approximated for a full-window box:
// free = below the top bar, above the MERT TURELI marquee; avoid = the drift word with its margins.
function frameInfo() {
  const w = innerWidth, h = innerHeight, vw = engine.viewAt(0);
  const marquee = Math.min(330, Math.max(96, .175 * w)) * .92;
  const free = { l: 16, r: w - 16, t: 78, b: h - marquee - 6 };
  const word = $('word'), avoid = [];
  word.style.display = wordOn ? '' : 'none';
  if (wordOn) {
    const r = word.getBoundingClientRect(), m = 22;
    avoid.push({ l: r.left - m, r: r.right + m * 1.6, t: r.top - m, b: r.bottom + m });
  }
  Object.assign($('frame').style, { left: free.l + 'px', top: free.t + 'px', width: free.r - free.l + 'px', height: free.b - free.t + 'px' });
  const a = avoid[0], av = $('avoid');
  av.style.display = a ? '' : 'none';
  if (a) Object.assign(av.style, { left: a.l + 'px', top: a.t + 'px', width: a.r - a.l + 'px', height: a.b - a.t + 'px' });
  return { halfW: vw.halfW, halfH: vw.halfH, camera: engine.camera, w, h, free, avoid };
}
let wordOn = !hash.has('noword');
$('wordbtn').setAttribute('aria-pressed', wordOn);
// The drift word sits in the hero stage, which ends where the marquee starts.
function placeWord() {
  const h = innerHeight - Math.min(330, Math.max(96, .175 * innerWidth)) * .92;
  const el = $('word');
  el.style.top = (parseFloat('38%') / 100 * h) + 'px';
}
function resize() {
  const w = innerWidth, h = innerHeight;
  applyCamera(engine.camera, LAYOUTS[w / h < 1 ? 'port' : 'land']);
  engine.size(w, h);
  placeWord();
  actor.layout(frameInfo());
}

// ---- contract check: the project actor interface (showreel/index.js)
const checks = [];
const check = (name, fn) => { let ok = false, note = ''; try { const r = fn(); ok = r === true || (r && r.ok); note = r && r.note || ''; } catch (e) { note = e.message; } checks.push({ name, ok, note }); };
function pose() { const p = []; actor.group.updateMatrixWorld(true); actor.group.traverse(o => { if (o.isMesh) p.push(...o.matrixWorld.elements.map(x => Math.round(x * 1e5))); }); return p.join(','); }
function runChecks() {
  check('group is a three.js Object3D', () => !!(actor.group && actor.group.isObject3D));
  for (const f of ['layout', 'sample', 'beginAbort', 'sampleAbort', 'reset', 'update', 'prewarm']) check(`${f}() is a function`, () => typeof actor[f] === 'function');
  check('visible is a boolean', () => typeof actor.visible === 'boolean');
  check('sequence is [[NAME, seconds>0], ...]', () => Array.isArray(actor.sequence) && actor.sequence.length > 0 && actor.sequence.every(s => typeof s[0] === 'string' && s[1] > 0));
  check('state names unique, not ROCKET_*', () => { const n = actor.sequence.map(s => s[0]); return new Set(n).size === n.length && !n.some(x => x === EXIT || x === RETURN); });
  const guest = timeline.list.filter(s => s.name !== EXIT && s.name !== RETURN);
  check(`guest part ${(timeline.total - 4.7).toFixed(1)} s (aim for 10 to 20)`, () => ({ ok: timeline.total - 4.7 <= 24, note: '' }));
  check('hidden at rest (after reset)', () => { actor.reset(); return actor.visible === false; });
  check('visible during its own states', () => guest.every(s => { actor.sample((s.t0 + s.t1) / 2, S); return actor.visible; }));
  check('hidden while the rocket exits and returns', () => { actor.sample(S[EXIT].t0 + .05, S); const a = actor.visible; actor.sample(S[RETURN].t1 - .01, S); return !a && !actor.visible; });
  check('sample(T) is a pure function of T', () => { const t = (guest[0].t0 + guest[guest.length - 1].t1) / 2; actor.sample(t, S); const a = pose(); actor.sample(guest[0].t0 + .1, S); actor.sample(timeline.total - .1, S); actor.sample(t, S); return a === pose(); });
  check('abort leaves fully (sampleAbort(1) hidden)', () => { const mid = guest[Math.floor(guest.length / 2)]; actor.sample((mid.t0 + mid.t1) / 2, S); actor.beginAbort(); for (let u = 0; u <= 1.0001; u += .1) actor.sampleAbort(Math.min(1, u)); const ok = actor.visible === false; actor.reset(); return ok; });
  check('word matches a drift word in next/index.html', () => wordCheck);
  actor.reset();
}
let wordCheck = { ok: false, note: 'not checked' };
try {
  const html = await (await fetch('../index.html')).text();
  const words = [...new DOMParser().parseFromString(html, 'text/html').querySelectorAll('[data-drift] .slot > i')].map(i => i.firstChild && i.firstChild.textContent.trim());
  wordCheck = { ok: words.includes(mod.WORD || 'Rudder pedals'), note: '' };
} catch (e) { wordCheck = { ok: false, note: 'could not read ../index.html' }; }

resize();
await actor.prewarm(engine.renderer, engine.camera, engine.scene);
runChecks();
actor.layout(frameInfo());

// ---- player
let T = 0, playing = false, speed = 1, mode = 'reel', A = 0, last = 0;
const slider = $('t');
slider.max = timeline.total.toFixed(2);
function draw() {
  engine.render();
  const st = mode === 'abort' ? 'ABORT ' + clamp01(A / 1.5).toFixed(2) : timeline.at(T).name;
  $('tv').textContent = T.toFixed(2) + ' s';
  $('state').textContent = `${st}${st === EXIT ? ' (rocket leaving: actor hidden)' : st === RETURN ? ' (rocket returning: actor hidden)' : ''} · visible ${actor.visible}`;
  const info = engine.renderer.info.render;
  $('stat').textContent = `${quality} · triangles ${info.triangles} · draw calls ${info.calls} · reel ${timeline.total.toFixed(1)} s`;
}
function seek(t) { mode = 'reel'; T = Math.max(0, Math.min(t, timeline.total - 1e-3)); actor.sample(T, S); actor.update(1 / 60, performance.now() / 1000); slider.value = T; draw(); return timeline.at(T).name; }
function loop(now) {
  const dt = last ? Math.min(.064, (now - last) / 1000) : 1 / 60; last = now;
  if (playing) {
    if (mode === 'abort') { A += dt * speed; actor.sampleAbort(clamp01(A / 1.5)); if (A >= 2.2) { mode = 'reel'; T = 0; actor.reset(); } }
    else { T += dt * speed; if (T >= timeline.total) T = 0; actor.sample(T, S); slider.value = T; }
    if (actor.visible) actor.update(dt, now / 1000);
    draw();
  }
  requestAnimationFrame(loop);
}
const setPlay = on => { playing = on; $('play').setAttribute('aria-pressed', on); $('play').textContent = on ? 'pause' : 'play'; };
$('play').onclick = () => setPlay(!playing);
$('fast').onclick = () => { speed = speed === 1 ? 3 : 1; $('fast').setAttribute('aria-pressed', speed === 3); };
$('abort').onclick = () => { if (mode !== 'reel' || !actor.visible) return; actor.beginAbort(); mode = 'abort'; A = 0; setPlay(true); };
$('reset').onclick = () => { setPlay(false); mode = 'reel'; T = 0; actor.reset(); slider.value = 0; draw(); };
$('wordbtn').onclick = () => { wordOn = !wordOn; $('wordbtn').setAttribute('aria-pressed', wordOn); actor.layout(frameInfo()); if (mode === 'reel') actor.sample(T, S); draw(); };
slider.oninput = () => { setPlay(false); seek(+slider.value); };
addEventListener('resize', () => { resize(); if (mode === 'reel') actor.sample(T, S); draw(); });

if (hash.has('fast')) $('fast').click();
const t0 = hash.has('t') ? +hash.get('t') : (S['RUDDER_PEDALS_ACTION'] ? (S['RUDDER_PEDALS_ACTION'].t0 + S['RUDDER_PEDALS_ACTION'].t1) / 2 : timeline.list[1].t1);
seek(t0);
if (!hash.has('t')) setPlay(true);
$('checks').innerHTML = checks.map(c => `<li class="${c.ok ? '' : 'bad'}">${c.name}${c.note ? ' (' + c.note + ')' : ''}</li>`).join('');
const nBad = checks.filter(c => !c.ok).length;
$('checksum').textContent = nBad ? `${nBad} of ${checks.length} checks FAILED` : `all ${checks.length} interface checks ok`;
$('checksum').classList.toggle('bad', nBad > 0);
$('checksbox').open = nBad > 0 || innerWidth > 700;
requestAnimationFrame(loop);

window.lab = { actor, timeline, engine, seek, play: () => setPlay(true), pause: () => setPlay(false) };
window.labReport = { ok: checks.every(c => c.ok), checks, errors, triangles: engine.renderer.info.render.triangles, calls: engine.renderer.info.render.calls, total: timeline.total };
window.labReady = true;
</script>
</body>
</html>
