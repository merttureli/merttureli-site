<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FX lab</title>
<style>
  :root { --paper: #e7e6e3; --ink: #121315; --muted: #676b72; --line: rgba(18,19,21,.16); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 12px; bottom: 12px; display: grid; grid-template-columns: auto 150px auto; gap: 3px 10px; align-items: center;
    padding: 10px 12px; background: rgba(231,230,227,.86); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; max-width: 520px; }
  .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: inherit; padding: 4px 10px; background: transparent; border: 1px solid var(--ink); border-radius: 99px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  input[type=range] { width: 150px; }
  .info { grid-column: 1 / -1; color: var(--muted); }
  body.shot .panel { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <div class="row">
    <button data-view="mug">Warm: mug</button><button data-view="can">Cold: can</button><button data-view="plate">Plate</button>
    <button id="bPlay" aria-pressed="false">play time</button><button id="bCycle" aria-pressed="false">chill cycle</button>
    <a href="?q=high"><button>high</button></a><a href="?q=low"><button>low</button></a>
  </div>
  <label for="steam">steam amount</label><input id="steam" type="range" min="0" max="1.5" step="0.01"><span id="steamv"></span>
  <label for="dist">disturbance</label><input id="dist" type="range" min="0" max="1" step="0.01"><span id="distv"></span>
  <label for="push">push</label><input id="push" type="range" min="-0.08" max="0.08" step="0.002"><span id="pushv"></span>
  <label for="shimmer">shimmer</label><input id="shimmer" type="range" min="0" max="1" step="0.01"><span id="shimmerv"></span>
  <label for="cond">condensation</label><input id="cond" type="range" min="0" max="1" step="0.005"><span id="condv"></span>
  <label for="ring">water ring</label><input id="ring" type="range" min="0" max="1" step="0.01"><span id="ringv"></span>
  <label for="fog">cold fog</label><input id="fog" type="range" min="0" max="1" step="0.01"><span id="fogv"></span>
  <label for="frost">frost film</label><input id="frost" type="range" min="0" max="1" step="0.01"><span id="frostv"></span>
  <label for="t">time</label><input id="t" type="range" min="0" max="20" step="0.01"><span id="tv"></span>
  <label for="zoom">zoom</label><input id="zoom" type="range" min="0.5" max="8" step="0.05"><span id="zoomv"></span>
  <label for="yaw">view yaw</label><input id="yaw" type="range" min="-180" max="180" step="1"><span id="yawv"></span>
  <div class="info" id="info"></div>
</div>
<script type="module">
// FX lab: steam, heat shimmer, condensation, the water ring, cold fog and the frost film on the real mug and can,
// under the studio look, on a stand-in of the coaster, framed like the hero.
//   ?view=mug|can|plate  ?q=low  ?shot (no UI)  ?zoom=1 (1 = hero size at 1440 x 900)  ?yaw=deg ?pitch=deg  ?ty=m
//   ?steam=0..1.5 ?dist=0..1 ?push=m ?shimmer=0..1 ?cond=0..1 ?ring=0..1 ?fog=0..1 ?frost=0..1  ?t=seconds
//   ?can=0 (plate view: no can, the ring it left)  ?bg=hex  ?play=1
// window.__lab = { ready (Promise), render(), set({ ... }), stats() }; window.labReport for the smoke check
import * as THREE from '../js/three.module.min.js';
import { addStudioLights } from '../js/showreel/engine.js';
import { createLook } from '../js/showreel/look.js';
import { createMug, createCan } from '../js/showreel/props.js';
import { createSteam, applyCondensation, createWaterRing, createColdFog, createFrost, createHeatShimmer, ready as fxReady } from '../js/showreel/fx.js';

const qs = new URLSearchParams(location.search);
const num = (k, d) => (qs.has(k) ? parseFloat(qs.get(k)) : d);
if (qs.has('shot')) document.body.classList.add('shot');
if (qs.get('bg')) document.body.style.background = '#' + qs.get('bg');
const quality = qs.get('q') === 'low' ? 'low' : 'high';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
addStudioLights(scene);
const camera = new THREE.PerspectiveCamera(24, 1, 0.05, 30);
camera.position.set(0, 0, 2.2);

const view0 = qs.get('view') || 'mug';
const state = {
  view: view0, yaw: num('yaw', -35.5), pitch: num('pitch', 22.9), zoom: num('zoom', 1.6), ty: num('ty', NaN),
  steam: num('steam', view0 === 'mug' ? 1 : 0), dist: num('dist', 0), push: num('push', 0), shimmer: num('shimmer', 0),
  cond: num('cond', view0 === 'mug' ? 0 : 0.7), ring: num('ring', view0 === 'mug' ? 0 : 0.6), fog: num('fog', view0 === 'mug' ? 0 : 0.7), frost: num('frost', view0 === 'mug' ? 0 : 0.6),
  t: num('t', 2.5), can: qs.get('can') !== '0', play: qs.get('play') === '1', cycle: false,
};

const t0 = performance.now();
const look = createLook({ renderer, quality });
const stage = new THREE.Group(), view = new THREE.Group();
scene.add(stage); stage.add(view);

// stand-in for the coaster: case, lid rim, bead-blasted plate
const HGT = 0.029, standIn = new THREE.Group(); view.add(standIn);
const plastic = look.material('plasticMatte'), plateMat = look.material('aluminumBeadBlast');
const box = (w, h, d, x, y, z, m) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); standIn.add(b); return b; };
box(0.0852, HGT - 0.0002, 0.0902, 0, -HGT / 2 - 0.0001, 0, plastic);
box(0.0802, 0.0015, 0.0802, 0, -0.00075, 0, plateMat);
box(0.0852, 0.0033, 0.005, 0, 0.00145, 0.0426, plastic); box(0.0852, 0.0033, 0.005, 0, 0.00145, -0.0426, plastic);
box(0.0025, 0.0033, 0.0802, 0.04135, 0.00145, 0, plastic); box(0.0025, 0.0033, 0.0802, -0.04135, 0.00145, 0, plastic);
const caseBox = new THREE.Box3(new THREE.Vector3(-0.0426, -HGT, -0.0451), new THREE.Vector3(0.0426, 0.0031, 0.0451));

const mug = createMug({ look, quality }), can = createCan({ look, quality });
mug.group.rotation.y = 0.9; can.group.rotation.y = -0.4;
view.add(mug.group, can.group);
const steam = createSteam({ radius: mug.rimRadius, height: 0.12, quality });
mug.group.add(steam.group); steam.group.position.y = mug.coffeeY;
const shimmer = createHeatShimmer({ width: 0.1, height: 0.075, quality });
view.add(shimmer.group); shimmer.group.position.y = 0.002;
const cond = applyCondensation(can.bodyMesh, { quality, fillLine: can.fillLine });
const ring = createWaterRing({ radius: can.radius, standRadius: can.footRadius, quality });
view.add(ring.group); ring.group.position.y = 0.0001;
const fog = createColdFog({ box: caseBox, quality });
view.add(fog.group);
const frost = createFrost({ size: 0.0802, quality });
view.add(frost.group);
look.adopt(view);

const ground = look.createGround({ parent: view, y: -HGT - 0.0002, size: 0.36 });
ground.add(standIn, {});
const plateGround = look.createGround({ parent: view, y: 0.0003, size: 0.0802, fade: 0.36, sweep: 0.3, renderOrder: 1,
  terms: { core: [0.0007, 0.05, 0.6, 0.004], key: [0.0030, 0.28, 0.35, 0.04], amb: [0.006, 0.3, 0.22, 0.05] } });
const noHandle = m => /handle/i.test(m.name || '');
for (const g of [ground, plateGround]) { g.add(mug.group, { shape: 'disc', radius: mug.outerRadius, exclude: noHandle }); g.add(can.group, { shape: 'disc', radius: can.radius }); }

function place() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const S = 2.55 * state.zoom;
  stage.scale.setScalar(S);
  view.rotation.set(THREE.MathUtils.degToRad(state.pitch), THREE.MathUtils.degToRad(state.yaw), 0);
  mug.group.visible = state.view === 'mug'; can.group.visible = state.view === 'can' || (state.view === 'plate' && state.can);
  const ty = Number.isFinite(state.ty) ? state.ty : ({ mug: 0.075, can: 0.045, plate: 0 })[state.view];
  const c = new THREE.Vector3(0, ty, 0).applyEuler(view.rotation).multiplyScalar(S);
  stage.position.set(-c.x, -c.y, 0);
  steam.setIntensity(state.view === 'mug' ? state.steam : 0); steam.setDisturbance(state.dist, state.push, 0, 0); steam.setTime(state.t);
  shimmer.setIntensity(state.shimmer); shimmer.setTime(state.t);
  cond.setAmount(state.cond); ring.setAmount(state.view === 'mug' ? 0 : state.ring);
  fog.setAmount(state.fog); fog.setTime(state.t); frost.setAmount(state.frost);
  look.setStudioCenter(view, 0.2, [0, -HGT / 2, 0]);
}
function render() {
  place();
  look.frame();
  renderer.render(scene, camera);
  const i = renderer.info.render;
  document.getElementById('info').textContent = `${quality} | frame: ${i.triangles} triangles, ${i.calls} draw calls | fog ${fog.triangles} triangles | shimmer ${shimmer.mesh ? 'one region copy' : 'off on low'}`;
  return { triangles: i.triangles, calls: i.calls };
}

// ---- UI
const el = id => document.getElementById(id);
const ids = ['steam', 'dist', 'push', 'shimmer', 'cond', 'ring', 'fog', 'frost', 't', 'zoom', 'yaw'];
const show = id => { el(id).value = state[id]; el(id + 'v').textContent = (+state[id]).toFixed(id === 'yaw' ? 0 : id === 'push' ? 3 : 2); };
for (const id of ids) { show(id); el(id).addEventListener('input', () => { state[id] = +el(id).value; show(id); render(); }); }
const sync = () => {
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
  el('bPlay').setAttribute('aria-pressed', String(state.play)); el('bCycle').setAttribute('aria-pressed', String(state.cycle));
  for (const id of ids) show(id);
};
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => { state.view = b.dataset.view; sync(); render(); });
el('bPlay').addEventListener('click', () => { state.play = !state.play; sync(); });
el('bCycle').addEventListener('click', () => { state.cycle = !state.cycle; state.view = 'can'; sync(); });
addEventListener('resize', render);
let last = 0, cyc = 0;
function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 0; last = now;
  if (state.play || state.cycle) {
    state.t += dt;
    if (state.cycle) { cyc = (cyc + dt / 14) % 1; state.cond = Math.min(1, cyc * 1.2); state.frost = Math.min(1, cyc * 1.6); state.fog = Math.min(1, cyc * 3); state.ring = Math.max(0, cyc * 1.5 - 0.5); }
    sync(); render();
  }
  requestAnimationFrame(loop);
}
sync();

const ready = (async () => {
  await look.ready(); await fxReady();
  const r = render();
  requestAnimationFrame(loop);
  window.labReport = { ok: r.calls > 0 && look.envMap !== null, why: look.envMap ? '' : 'no environment', ...r, buildMs: performance.now() - t0, stats: look.stats() };
  return true;
})().catch(e => { window.labReport = { ok: false, why: String(e && e.message || e) }; throw e; });
window.__lab = { ready, render, set(o) { Object.assign(state, o); sync(); return render(); }, stats: () => look.stats(), look, state, mug, can, steam, cond, ring, fog, frost, shimmer, THREE, renderer };
</script>
</body>
</html>
