<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FX lab</title>
<style>
  :root { --paper: #e7e8ea; --ink: #121315; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 460px; background: rgba(255,255,255,.55); backdrop-filter: blur(6px); border: 1px solid rgba(18,19,21,.12); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
  .panel input[type=range] { width: 100%; }
  .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .panel.hide { display: none; }
  button { font: inherit; padding: 3px 8px; border: 1px solid rgba(18,19,21,.25); background: transparent; border-radius: 6px; cursor: pointer; }
  button.on { background: var(--ink); color: var(--paper); }
  output { min-width: 3ch; text-align: right; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="panel">
  <label for="steam">steam</label><input id="steam" type="range" min="0" max="1" step="0.01" value="1"><output id="steamO"></output>
  <label for="amount">condens.</label><input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"><output id="amountO"></output>
  <label for="ring">ring</label><input id="ring" type="range" min="0" max="1" step="0.01" value="0.6"><output id="ringO"></output>
  <label for="shimmer">shimmer</label><input id="shimmer" type="range" min="0" max="1" step="0.01" value="0"><output id="shimmerO"></output>
  <label for="az">orbit</label><input id="az" type="range" min="-180" max="180" step="1" value="0"><output id="azO"></output>
  <div class="row">
    <button data-view="both">both</button><button data-view="mug">mug</button><button data-view="can">can 30cm</button><button data-view="hero">hero</button>
    <button id="anim">animate</button><button id="cycle">chill cycle</button><button id="env">env</button>
  </div>
  <div class="row" id="info"></div>
</div>
<script type="module">
import * as THREE from '../js/three.module.min.js';
import { createSteam, applyCondensation, createWaterRing, createHeatShimmer } from '../js/showreel/fx.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
const state = {
  view: Q.get('view') || 'both', steam: num('steam', 1), amount: num('amount', 0.6), ring: num('ring', 0.6), shimmer: num('shimmer', 0),
  az: num('az', 0), anim: Q.get('anim') !== '0', cycle: Q.get('cycle') === '1', env: Q.get('env') !== '0', t: num('t', 2.5),
};
if (Q.get('ui') === '0') document.getElementById('panel').classList.add('hide');
if (Q.get('bg')) document.body.style.background = '#' + Q.get('bg');

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
// the engine's own studio rig + environment when engine.js exists, else a copy of hero3d.js lighting
let engineMod = null;
try { engineMod = await import('../js/showreel/engine.js'); } catch (e) { console.info('engine.js not available'); }
if (engineMod && engineMod.addStudioLights) engineMod.addStudioLights(scene);
else {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x7d828c, 1.35));
  const key = new THREE.DirectionalLight(0xfff8f0, 3.8); key.position.set(-2.5, 4, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfe6ff, 1.1); fill.position.set(4, -1, 3); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 2.4); rim.position.set(3, 3, -4); scene.add(rim);
}
// environment applied per material like engine.adopt() (envMapIntensity x0.55), toggled by the env button
let envTex = null;
const adopted = [];
function setEnv(on) {
  if (on && !envTex) envTex = engineMod && engineMod.createStudioEnvironment ? engineMod.createStudioEnvironment(renderer) : null;
  if (!adopted.length) scene.traverse(o => { const ms = o.material ? [].concat(o.material) : []; for (const m of ms) if (m.isMeshStandardMaterial && !adopted.includes(m)) { adopted.push(m); m.userData.labEnvGain = m.envMapIntensity * 0.55; } });
  for (const m of adopted) { const want = on ? envTex : null; if (m.envMap !== want) { m.envMap = want; m.envMapIntensity = m.userData.labEnvGain; m.needsUpdate = true; } }
}
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 10);
const stage = new THREE.Group(); scene.add(stage);

// stand-in plate (coaster top), real props swap in below when props.js exists
const plate = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.004, 0.11), new THREE.MeshStandardMaterial({ color: 0xb9bcc0, roughness: 0.45, metalness: 0.6 }));
plate.position.y = -0.002; stage.add(plate);
const body = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.041, 0.11), new THREE.MeshStandardMaterial({ color: 0x6d7a88, roughness: 0.7 }));
body.position.y = -0.0245; stage.add(body);

function standInMug() {
  const group = new THREE.Group();
  const pts = [[0, 0], [0.036, 0], [0.039, 0.004], [0.041, 0.085], [0.0375, 0.085], [0.0355, 0.008], [0, 0.008]].map(([x, y]) => new THREE.Vector2(x, y));
  const mug = new THREE.Mesh(new THREE.LatheGeometry(pts, 48), new THREE.MeshStandardMaterial({ color: 0xece9e2, roughness: 0.72 }));
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.006, 10, 24, Math.PI), mug.material);
  handle.rotation.z = -Math.PI / 2; handle.position.set(0.04, 0.045, 0);
  const coffeeSurface = new THREE.Mesh(new THREE.CircleGeometry(0.0368, 40), new THREE.MeshStandardMaterial({ color: 0x2a160c, roughness: 0.25 }));
  coffeeSurface.rotation.x = -Math.PI / 2; coffeeSurface.position.y = 0.074;
  group.add(mug, handle, coffeeSurface);
  return { group, coffeeSurface, rimRadius: 0.0375, dispose() {} };
}
function standInCan() {
  const group = new THREE.Group();
  const bodyPts = [[0.026, 0.0], [0.031, 0.004], [0.033, 0.012], [0.033, 0.104], [0.030, 0.114], [0.027, 0.118]].map(([x, y]) => new THREE.Vector2(x, y));
  const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xb3121c, roughness: 0.42, metalness: 0.35 });
  const bodyMesh = new THREE.Mesh(new THREE.LatheGeometry(bodyPts, 64), bodyMaterial);
  const alu = new THREE.MeshStandardMaterial({ color: 0xc9ccd0, roughness: 0.35, metalness: 0.9 });
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.0272, 0.027, 0.004, 48), alu); top.position.y = 0.12;
  const bot = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.024, 0.002, 48), alu); bot.position.y = 0.001;
  group.add(bodyMesh, top, bot);
  return { group, bodyMesh, bodyMaterial, dispose() {} };
}

let mug, can, usingProps = false;
try {
  const props = await import('../js/showreel/props.js');
  if (props.createMug && props.createCan && Q.get('standin') !== '1') {
    mug = props.createMug({ THREE, renderer, quality: 'high' });
    can = props.createCan({ THREE, renderer, quality: 'high' });
    mug.setProgress && mug.setProgress(1); can.setProgress && can.setProgress(1);
    usingProps = true;
  }
} catch (e) { console.info('props.js not available, using stand-ins', e.message); }
if (!mug) { mug = standInMug(); can = standInCan(); }
mug.group.position.set(-0.034, 0, -0.01); can.group.position.set(0.036, 0, 0.014);
stage.add(mug.group, can.group);

// steam rooted at the coffee surface centre (in mug-group space)
stage.updateMatrixWorld(true);
const coffeePos = new THREE.Vector3();
if (mug.coffeeSurface) { mug.coffeeSurface.getWorldPosition(coffeePos); mug.group.worldToLocal(coffeePos); } else coffeePos.set(0, 0.075, 0);
const steam = createSteam({ radius: (mug.rimRadius || 0.037) * 0.95, height: 0.19, quality: Q.get('q') || 'high' });
steam.group.position.copy(coffeePos); mug.group.add(steam.group);
const shimmer = createHeatShimmer({ radius: mug.rimRadius || 0.037 });
shimmer.group.position.copy(coffeePos); mug.group.add(shimmer.group);

const bodyMesh = can.bodyMesh || can.group.getObjectByName('body');
const cond = applyCondensation(bodyMesh, {});
const ring = createWaterRing({ radius: 0.033 });
ring.group.position.set(can.group.position.x, 0, can.group.position.z); stage.add(ring.group);

const VIEWS = {
  both: { target: [0, 0.06, 0], dist: 0.42, el: 0.22, fov: 35 },
  mug: { target: [-0.034, 0.13, -0.01], dist: 0.42, el: 0.12, fov: 35, mobileDist: 0.5 },
  can: { target: [0.036, 0.06, 0.014], dist: 0.3, el: 0.08, fov: 35, mobileDist: 0.42 },
  hero: { target: [0, 0.07, 0], dist: 0.9, el: 0.25, fov: 30 },
};
function placeCamera() {
  const v = VIEWS[state.view] || VIEWS.both;
  const w = innerWidth, h = innerHeight, aspect = w / h;
  let dist = v.dist; if (aspect < 0.8) dist = (v.mobileDist || v.dist * 1.45);
  const az = THREE.MathUtils.degToRad(state.az);
  camera.fov = v.fov; camera.aspect = aspect;
  camera.position.set(v.target[0] + Math.sin(az) * Math.cos(v.el) * dist, v.target[1] + Math.sin(v.el) * dist, v.target[2] + Math.cos(az) * Math.cos(v.el) * dist);
  camera.lookAt(v.target[0], v.target[1], v.target[2]);
  camera.updateProjectionMatrix();
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); placeCamera(); }
addEventListener('resize', () => { resize(); render(); });

function apply() {
  steam.setIntensity(state.steam); cond.setAmount(state.amount); ring.setAmount(state.ring); shimmer.setIntensity(state.shimmer);
  setEnv(state.env);
  for (const id of ['steam', 'amount', 'ring', 'shimmer', 'az']) { document.getElementById(id).value = state[id]; document.getElementById(id + 'O').textContent = (+state[id]).toFixed(id === 'az' ? 0 : 2); }
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  document.getElementById('anim').classList.toggle('on', state.anim);
  document.getElementById('cycle').classList.toggle('on', state.cycle);
  document.getElementById('env').classList.toggle('on', state.env);
  document.getElementById('info').textContent = (usingProps ? 'props.js' : 'stand-ins') + ' | tris ' + renderer.info.render.triangles + ' | calls ' + renderer.info.render.calls;
  placeCamera();
}
function render() { renderer.render(scene, camera); }

for (const id of ['steam', 'amount', 'ring', 'shimmer', 'az']) document.getElementById(id).addEventListener('input', e => { state[id] = parseFloat(e.target.value); apply(); render(); });
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; apply(); render(); }));
document.getElementById('anim').addEventListener('click', () => { state.anim = !state.anim; apply(); kick(); });
document.getElementById('cycle').addEventListener('click', () => { state.cycle = !state.cycle; apply(); kick(); });
document.getElementById('env').addEventListener('click', () => { state.env = !state.env; apply(); render(); });

steam.setTime(state.t); shimmer.setTime(state.t);
let last = 0, raf = 0, cycleT = 0;
function loop(now) {
  raf = 0;
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 0; last = now;
  if (state.cycle) { cycleT += dt; const p = (cycleT % 24) / 24; state.amount = Math.min(1, p * 1.25); state.ring = Math.max(0, p * 1.4 - 0.4); apply(); }
  steam.update(dt); shimmer.update(dt);
  render();
  if (state.anim || state.cycle) raf = requestAnimationFrame(loop);
}
function kick() { last = 0; if (!raf) raf = requestAnimationFrame(loop); }
resize(); apply(); render(); apply();
if (state.anim || state.cycle) kick();

// hooks for screenshots
window.lab = {
  set(o) { Object.assign(state, o); if (o.t != null) { steam.setTime(o.t); shimmer.setTime(o.t); } apply(); render(); return state; },
  step(dt) { steam.update(dt); shimmer.update(dt); render(); },
  bench(n = 20) {
    const gl = renderer.getContext(), px = new Uint8Array(4);
    render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { steam.update(1 / 60); shimmer.update(1 / 60); render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    return (performance.now() - t0) / n;
  },
  usingProps, renderer, ready: true,
};
</script>
</body>
</html>
