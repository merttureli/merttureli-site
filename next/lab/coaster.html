<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaster lab</title>
<meta name="robots" content="noindex">
<style>
  :root { --paper: #e7e6e3; --ink: #121315; --line: rgba(18, 19, 21, .14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: grid; gap: 8px; max-width: 620px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .55); backdrop-filter: blur(8px); }
  .row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; }
  .row input { width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: rgba(255, 255, 255, .6); border-radius: 999px; padding: 5px 10px; cursor: pointer; color: inherit; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  a button { color: var(--ink); }
  .stat { opacity: .7; }
  body.shot .ui { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="row"><label for="p">assembly</label><input id="p" type="range" min="0" max="1" step="0.001" value="1"><span id="pv">1.00</span></div>
  <div class="row"><label for="temp">plate &deg;C</label><input id="temp" type="range" min="0" max="70" step="0.5" value="22"><span id="tempv">22</span></div>
  <div class="row"><label for="frost">frost</label><input id="frost" type="range" min="-0.01" max="1" step="0.01" value="-0.01"><span id="frostv">auto</span></div>
  <div class="row"><label for="fan">fan turns/s</label><input id="fan" type="range" min="0" max="9" step="0.1" value="0"><span id="fanv">0</span></div>
  <div class="row"><label for="az">turn</label><input id="az" type="range" min="-180" max="180" step="1" value="-35.5"><span id="azv">-36</span></div>
  <div class="row"><label for="el">elevation</label><input id="el" type="range" min="-20" max="90" step="1" value="22.9"><span id="elv">23</span></div>
  <div class="row"><label for="zoom">zoom</label><input id="zoom" type="range" min="0.5" max="30" step="0.05" value="1"><span id="zoomv">1.0</span></div>
  <div class="btns" id="views">
    <button data-view="hero">hero</button><button data-view="top">top, grazing</button><button data-view="front">port face</button><button data-view="exploded">exploded</button>
    <button data-view="plate">plate edge</button><button data-view="screw">screw</button><button data-view="button">button</button><button data-view="port">port</button><button data-view="vent">vent</button>
    <button data-view="peltier">Peltier</button><button data-view="sink">heatsink</button><button data-view="blower">blower</button><button data-view="boards">boards</button>
  </div>
  <div class="btns">
    <button data-temp="55">warm</button><button data-temp="22">neutral</button><button data-temp="11">cold</button>
    <button id="spin" aria-pressed="false">turntable</button><button id="cull" aria-pressed="true">hide inside when closed</button>
    <a href="?q=high"><button>high</button></a><a href="?q=low"><button>low</button></a><a href="?look=0"><button>no look</button></a>
  </div>
  <div class="stat" id="stat"></div>
</div>
<script type="module">
// Coaster lab: the Therma-Shift device alone, on the page colour, under the same camera, rig and studio look the
// reel gives it (look.js dressThermaShift), so what shows here is what the hero and the case stage show.
//   ?q=low            low tier            ?look=0   no look: plain materials and the old decals (what the 3D viewer gets)
//   ?shot             no panel            ?view=hero|top|front|exploded|plate|screw|button|port|vent|peltier|sink|blower|boards
//   ?p=0..1           assembly            ?temp=C   ?frost=0..1 (omit: frost follows the temperature)   ?fan=turns/s
//   ?az=deg ?el=deg ?zoom=x ?tx= ?ty= ?tz= (mm, the point kept at the centre)   ?solo=part (show one part)
//   ?mirror=1         with the look's optional faint reflection of the case in the page (off in the reel)
//   ?cull=0           draw the inside even when closed   ?front=1 single-sided materials (shows winding mistakes)
// window.__lab = { ready (Promise), render(), set({ ... }), stats(), coaster, look, state }; window.labReport for the smoke check.
import * as THREE from '../js/three.module.min.js';
import createCoaster from '../js/showreel/coaster.js';
import { addStudioLights, createStudioEnvironment } from '../js/showreel/engine.js';

const qs = new URLSearchParams(location.search);
if (qs.has('shot')) document.body.classList.add('shot');
const quality = qs.get('q') === 'low' ? 'low' : 'high';
const useLook = qs.get('look') !== '0';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.debug.checkShaderErrors = true;
const scene = new THREE.Scene();
addStudioLights(scene);
const camera = new THREE.PerspectiveCamera(24, 1, 0.05, 30);
camera.position.set(0, 0, 2.2);

// stage (scale, place) > view (the viewing angle) > coaster: the reel's own scene graph
const stage = new THREE.Group(), view = new THREE.Group(), pan = new THREE.Group();
scene.add(stage); stage.add(view); view.add(pan);
const VIEWS = {
  hero: { p: 1, az: -35.5, el: 22.9, zoom: 1, tx: 0, ty: -13, tz: 0, solo: '' },
  top: { p: 1, az: -35.5, el: 9, zoom: 1.5, tx: 0, ty: -8, tz: 0, solo: '' },
  front: { p: 1, az: -8, el: 12, zoom: 2.2, tx: 0, ty: -14, tz: 45, solo: '' },
  exploded: { p: 0, az: -35.5, el: 22.9, zoom: 0.62, tx: 0, ty: 0, tz: 0, solo: '' },
  plate: { p: 1, az: -35.5, el: 16, zoom: 14, tx: 30, ty: 1, tz: 40, solo: '' },
  screw: { p: 1, az: -35.5, el: 30, zoom: 22, tx: 35, ty: 3, tz: 42.5, solo: '' },
  button: { p: 1, az: -24, el: 14, zoom: 6, tx: 29.6, ty: -16.3, tz: 47, solo: '' },
  port: { p: 1, az: -18, el: 14, zoom: 6.5, tx: -25.5, ty: -24, tz: 45, solo: '' },
  vent: { p: 1, az: -14, el: 12, zoom: 4.2, tx: 0, ty: -22, tz: 45, solo: '' },
  peltier: { p: 0, az: -35.5, el: 26, zoom: 4.6, tx: 0, ty: -3.3, tz: 0, solo: 'peltier' },
  sink: { p: 0, az: -35.5, el: 14, zoom: 4.6, tx: 0, ty: -11, tz: 0, solo: 'heatsink' },
  blower: { p: 0, az: -35.5, el: 34, zoom: 4.6, tx: 0, ty: -22, tz: 0, solo: 'blower' },
  boards: { p: 0, az: -62, el: 24, zoom: 2.8, tx: 5, ty: -15, tz: 5, solo: 'board' },
};
const num = (k, d) => (qs.has(k) ? +qs.get(k) : d);
const state = { ...VIEWS.hero, ...(VIEWS[qs.get('view')] || {}), temp: 22, frost: -1, fan: 0, spin: false, cull: qs.get('cull') !== '0', mirror: qs.get('mirror') === '1' };
for (const k of ['p', 'temp', 'frost', 'fan', 'az', 'el', 'zoom', 'tx', 'ty', 'tz']) state[k] = num(k, state[k]);
if (qs.has('solo')) state.solo = qs.get('solo');

const pre = new Set();
const fakeEngine = { renderer, addPrePass: f => (pre.add(f), () => pre.delete(f)) };
const coaster = createCoaster({ THREE, renderer: useLook ? renderer : undefined, quality });
pan.add(coaster.group);
if (qs.get('front') === '1') coaster.group.traverse(o => { if (o.isMesh && !o.material.transparent) o.material.side = THREE.FrontSide; });
let dress = null, envOld = null;
const parts = coaster.getParts();

function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const vh = camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), vw = vh * camera.aspect;
  const S = 2 * Math.min(vw, vh) * (w < h ? 0.44 : 0.3) / 0.11 * state.zoom;        // the reel's own size at zoom 1
  stage.scale.setScalar(S);
  view.rotation.set(THREE.MathUtils.degToRad(state.el), THREE.MathUtils.degToRad(state.az), 0);
  pan.position.set(-state.tx / 1000, -state.ty / 1000, -state.tz / 1000);
  const one = state.solo && parts.find(P => P.name === state.solo);       // a single part: follow it where it floats
  if (one) pan.position.sub(one.mesh.position);
}
function render() {
  coaster.setCull(state.cull);
  coaster.setProgress(state.p);
  coaster.setFrost(state.frost < 0 ? null : state.frost);
  coaster.setPlateTemperature(state.temp);
  coaster.setFanSpeed(state.fan);
  for (const P of parts) P.mesh.visible = !state.solo || state.solo.split(',').includes(P.name);
  frame();
  for (const f of pre) f(renderer, scene, camera);
  if (dress && !state.mirror) for (const m of dress.ground.mirrors) m.r.visible = false;
  renderer.render(scene, camera);
  const i = renderer.info.render, s = coaster.stats(), L = coaster.look ? coaster.look.stats() : null;
  el('stat').textContent = `${quality}${useLook ? '' : ', no look'} | drawn: ${i.triangles} triangles, ${i.calls} draw calls, 0 passes | coaster ${s.total} triangles (${s.closed} closed), ${s.meshes} meshes | ` +
    `own textures ${(s.textureBytes / 1024).toFixed(0)} KB in ${s.slices} slices (longest ${s.maxSliceMs.toFixed(1)} ms) | programs ${renderer.info.programs.length}` +
    (L ? ` | look: env ${L.envMs.toFixed(0)} ms, ${L.textures} textures` : '');
  for (const k of ['p', 'temp', 'fan', 'az', 'el', 'zoom']) { const o = el(k + 'v'); if (o) o.textContent = (+state[k]).toFixed(k === 'p' ? 2 : k === 'zoom' || k === 'fan' ? 1 : 0); }
  el('frostv').textContent = state.frost < 0 ? 'auto' : state.frost.toFixed(2);
  return { triangles: i.triangles, calls: i.calls };
}
const el = id => document.getElementById(id);
function syncUi() {
  for (const k of ['p', 'temp', 'frost', 'fan', 'az', 'el', 'zoom']) el(k).value = state[k];
  el('spin').setAttribute('aria-pressed', String(state.spin)); el('cull').setAttribute('aria-pressed', String(state.cull));
}
for (const k of ['p', 'temp', 'frost', 'fan', 'az', 'el', 'zoom']) el(k).addEventListener('input', e => { state[k] = +e.target.value; render(); });
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => { Object.assign(state, VIEWS[b.dataset.view]); syncUi(); render(); });
for (const b of document.querySelectorAll('[data-temp]')) b.addEventListener('click', () => { state.temp = +b.dataset.temp; syncUi(); render(); });
el('spin').addEventListener('click', () => { state.spin = !state.spin; syncUi(); });
el('cull').addEventListener('click', () => { state.cull = !state.cull; syncUi(); render(); });
addEventListener('resize', render);
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, az: state.az, el: state.el }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (drag) { state.az = drag.az + (e.clientX - drag.x) * 0.4; state.el = Math.max(-20, Math.min(90, drag.el + (e.clientY - drag.y) * 0.3)); syncUi(); render(); } });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.max(0.5, Math.min(30, state.zoom * Math.exp(-e.deltaY * 0.001))); syncUi(); render(); }, { passive: false });
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let dirty = false;
  if (state.spin) { state.az = ((state.az + dt * 14 + 180) % 360) - 180; el('az').value = state.az; dirty = true; }
  if (state.fan > 0 && state.p < 0.83 || state.fan > 0 && !state.cull) { coaster.update(dt, now / 1000); dirty = true; }
  if (dirty) render();
  requestAnimationFrame(loop);
}

const t0 = performance.now();
const ready = (async () => {
  if (useLook) {
    const { dressThermaShift } = await import('../js/showreel/look.js');
    coaster.setProgress(1); frame(); stage.updateMatrixWorld(true);
    dress = await dressThermaShift({ engine: fakeEngine, quality, stage, view: pan, coaster, mug: null, can: null, plate: coaster.parts.topPlate, parts, reflection: state.mirror });
  } else {
    // what a caller without the look gets: the shared environment at 0.55, the baked decal shadow
    envOld = createStudioEnvironment(renderer);
    coaster.group.traverse(o => { for (const m of [].concat(o.material || [])) if (m.isMeshStandardMaterial && !m.envMap) { m.envMap = envOld; m.envMapIntensity *= 0.55; m.needsUpdate = true; } });
  }
  await coaster.ready;
  syncUi();
  const r = render();
  requestAnimationFrame(loop);
  const s = coaster.stats();
  const ok = r.calls > 0 && r.calls <= 40 && s.total > 5000 && s.total < 60000 && s.closed < s.total;
  window.labReport = { ok, why: ok ? '' : 'budget or draw check failed', ...r, coaster: s, buildMs: Math.round(performance.now() - t0), quality, look: useLook };
  return true;
})().catch(e => { window.labReport = { ok: false, why: String(e && e.message || e) }; throw e; });
window.__lab = { ready, render, set(o) { Object.assign(state, o); syncUi(); return render(); }, stats: () => ({ coaster: coaster.stats(), look: coaster.look ? coaster.look.stats() : null, info: { ...renderer.info.render, programs: renderer.info.programs.length } }), coaster, get look() { return coaster.look; }, state, VIEWS, THREE, scene, camera, renderer, get dress() { return dress; } };
</script>
</body>
</html>
