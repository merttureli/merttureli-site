<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaster lab</title>
<meta name="robots" content="noindex">
<style>
  :root { --paper: #e7e6e3; --ink: #121315; --line: rgba(18, 19, 21, .14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: grid; gap: 8px; max-width: 520px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .55); backdrop-filter: blur(8px); }
  .row { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 10px; }
  .row input { width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; border: 1px solid var(--line); background: rgba(255, 255, 255, .6); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .stat { opacity: .6; }
  body.shot .ui { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="row"><label for="p">progress</label><input id="p" type="range" min="0" max="1" step="0.001" value="1"><span id="pv">1.00</span></div>
  <div class="row"><label for="t">plate &deg;C</label><input id="t" type="range" min="0" max="70" step="0.5" value="22"><span id="tv">22</span></div>
  <div class="row"><label for="a">azimuth</label><input id="a" type="range" min="-180" max="180" step="1" value="28"><span id="av">28</span></div>
  <div class="btns">
    <button data-p="1">assembled</button><button data-p="0">exploded</button><button id="play">play</button>
    <button data-t="65">warm</button><button data-t="22">neutral</button><button data-t="4">cold</button>
    <button id="spin" aria-pressed="false">turntable</button><button id="env" aria-pressed="true">env</button><button id="fan" aria-pressed="false">fan</button>
  </div>
  <div class="stat" id="stat"></div>
</div>
<script type="module">
import * as THREE from '../js/three.module.min.js';
import createCoaster from '../js/showreel/coaster.js';
import { addStudioLights, createStudioEnvironment } from '../js/showreel/engine.js';

const qs = new URLSearchParams(location.search);
if (qs.has('shot')) document.body.classList.add('shot');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);

// The engine's own studio rig and environment (engine.js), applied the way engine.adopt() does it: module materials get
// the PMREM environment at envGain 0.55, nothing else does.
const scene = new THREE.Scene();
addStudioLights(scene);
const envTex = createStudioEnvironment(renderer);
const ENV_GAIN = 0.55;
function adopt(root, on) {
  root.traverse((o) => { if (o.material && o.material.isMeshStandardMaterial) { o.material.envMap = on ? envTex : null; o.material.envMapIntensity = ENV_GAIN; o.material.needsUpdate = true; } });
}

const camera = new THREE.PerspectiveCamera(26, 1, 0.01, 10);
const pivot = new THREE.Group(); scene.add(pivot);
const coaster = createCoaster({ THREE, renderer, quality: qs.get('q') || 'high' });
pivot.add(coaster.group);
adopt(coaster.group, true);
let envOn = true;

const state = { p: 1, t: 22, az: 28, el: 24, zoom: 1, spin: false, play: false, fan: false };
const el = (id) => document.getElementById(id);
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // fit a sphere that grows from the assembled box to the tall exploded stack, whatever the aspect
  const tall = 1 - state.p, r = 0.082 + tall * 0.05;
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = r / Math.sin(Math.min(vf, hf) / 2) * (camera.aspect < 1 ? 1.08 : 1.25) / state.zoom;
  const el2 = THREE.MathUtils.degToRad(state.el);
  camera.position.set(0, -0.022 + Math.sin(el2) * dist, Math.cos(el2) * dist);
  camera.lookAt(0, -0.022 - tall * 0.006, 0);
  camera.updateProjectionMatrix();
}
function render() {
  pivot.rotation.y = THREE.MathUtils.degToRad(-state.az);
  coaster.setProgress(state.p);
  coaster.setPlateTemperature(state.t);
  frame();
  renderer.render(scene, camera);
  el('pv').textContent = state.p.toFixed(2); el('tv').textContent = state.t; el('av').textContent = Math.round(state.az);
}
el('stat').textContent = `triangles ${Math.round(coaster.triangles)} · parts ${coaster.getParts().map((p) => p.name).join(', ')}`;
el('p').oninput = (e) => { state.p = +e.target.value; render(); };
el('t').oninput = (e) => { state.t = +e.target.value; render(); };
el('a').oninput = (e) => { state.az = +e.target.value; render(); };
document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { state.p = +b.dataset.p; el('p').value = state.p; render(); });
document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { state.t = +b.dataset.t; el('t').value = state.t; render(); });
const toggle = (id, k, fn) => el(id).onclick = () => { state[k] = !state[k]; el(id).setAttribute('aria-pressed', state[k]); fn && fn(); render(); };
toggle('spin', 'spin'); toggle('fan', 'fan', () => coaster.setFanSpeed(state.fan ? 3 : 0));
el('env').onclick = () => { envOn = !envOn; adopt(coaster.group, envOn); el('env').setAttribute('aria-pressed', envOn); render(); };
let playT = -1;
el('play').onclick = () => { state.play = true; playT = 0; };
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let dirty = false;
  if (state.spin) { state.az = ((state.az + dt * 30 + 180) % 360) - 180; el('a').value = state.az; dirty = true; }
  if (state.play) { playT += dt / coaster.duration; const k = playT % 2; state.p = k < 1 ? k : 2 - k; el('p').value = state.p; dirty = true; }
  if (state.fan) { coaster.update(dt, now / 1000); dirty = true; }
  if (dirty) render();
  requestAnimationFrame(loop);
}
addEventListener('resize', render);
// pointer drag rotates
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, az: state.az }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (drag) { state.az = drag.az - (e.clientX - drag.x) * 0.4; el('a').value = state.az; render(); } });
canvas.addEventListener('pointerup', () => drag = null);
for (const k of ['p', 't', 'az', 'el', 'zoom']) if (qs.has(k)) state[k] = +qs.get(k);
el('p').value = state.p; el('t').value = state.t; el('a').value = state.az;
render();
requestAnimationFrame(loop);
window.lab = { coaster, state, render, THREE, scene, camera, renderer, set(o) { Object.assign(state, o); render(); }, setEnv(on) { envOn = on; adopt(coaster.group, on); render(); } };
window.labReady = true;
</script>
</body>
</html>
